global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    lab: otel-observabilidad

# Módulo B (AIOps y correlación) -- ver alert_rules.yml. Sin Alertmanager
# configurado en este stack local, las alertas quedan visibles vía
# GET http://localhost:9091/api/v1/alerts (lo que consulta
# chaos/measure_mttd.py --backend local) y en la pestaña Alerts de la UI
# de Prometheus -- suficiente para medir MTTD localmente sin añadir un
# contenedor más al stack.
rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # Métricas de negocio de los servicios, re-exportadas por el Collector
  # (prometheus exporter) con resource_to_telemetry_conversion habilitado.
  - job_name: otel-collector-apps
    static_configs:
      - targets: ["otel-collector:8889"]

  # Telemetría interna del propio Collector (spans/logs/métricas
  # aceptados, rechazados, encolados) -- panel de salud del Collector.
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  # Scraping directo de /metrics de cada servicio (redundante con el
  # anterior, útil para validar que el endpoint Prometheus del SDK
  # funciona de forma independiente del Collector).
  - job_name: service-a
    static_configs:
      - targets: ["service-a:9090"]

  - job_name: service-b
    static_configs:
      - targets: ["service-b:9091"]

  - job_name: data-service
    static_configs:
      - targets: ["data-service:9093"]
