# Reglas de alerta locales (Módulo B: AIOps y correlación).
#
# Implementa la MISMA regla que iac/terraform/aws/cloudwatch_aiops.tf y
# iac/terraform/gcp/monitoring_aiops.tf, pero cloud-agnóstica y verificable
# 100% localmente con `docker compose` -- esto es lo que de verdad se puede
# probar antes de gastar presupuesto de nube (ver el plan de ejecución en
# docs/runbooks/02-modulo-b-aiops.md), y sirve de referencia para confirmar
# que la fórmula ("baseline + 2σ" calculado explícitamente, no una caja
# negra) da resultados sensatos antes de traducirla a MQL/CloudWatch.
#
# Prometheus expone las alertas actualmente en "firing" en
# /api/v1/alerts SIN necesitar Alertmanager -- chaos/measure_mttd.py
# (backend "local") consulta ese endpoint directamente.
groups:
  - name: error-rate-baseline
    interval: 30s
    rules:
      # --- Recording rules: la señal cruda y su banda de baseline ± 2σ ---
      # `clamp_min(..., 1e-9)` en el denominador evita una división 0/0
      # (-> NaN) cuando no hay tráfico HTTP en la ventana de 2m. Un NaN
      # aquí contaminaría avg_over_time/stddev_over_time del baseline
      # de abajo durante los siguientes 30 minutos completos (cualquier
      # NaN dentro de la ventana hace NaN el agregado entero), y una
      # comparación `valor > NaN` siempre da false en IEEE 754 -- la
      # alerta quedaría ciega aunque el error rate real se dispare.
      # Confirmado empíricamente en el laboratorio (Módulo D, exp. 2,
      # 2026-08-29): tras varios ciclos de arranque/parada de
      # contenedores sin tráfico, `baseline_mean_30m`/`baseline_stddev_30m`
      # quedaron en NaN mientras el error rate real ya estaba en 100%,
      # y `CorrelatedDegradation` nunca disparó. El clamp no distorsiona
      # ninguna lectura real (cualquier tráfico real es >>1e-9 req/s);
      # solo evita el 0/0 exacto cuando no hay tráfico en absoluto.
      - record: service_a:http_error_rate:ratio_rate2m
        expr: |
          sum(rate(http_requests_total{job="service-a", status=~"5.."}[2m]))
          /
          clamp_min(sum(rate(http_requests_total{job="service-a"}[2m])), 1e-9)
          * 100

      - record: service_a:http_error_rate:baseline_mean_30m
        expr: avg_over_time(service_a:http_error_rate:ratio_rate2m[30m])

      - record: service_a:http_error_rate:baseline_stddev_30m
        expr: stddev_over_time(service_a:http_error_rate:ratio_rate2m[30m])

      - record: service_a:http_latency_p99:2m
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_request_duration_seconds_bucket{job="service-a"}[2m])) by (le)
          )

      # --- Segunda señal de error rate: degradación silenciosa ------------
      # Hallazgo real del Experimento 2 (Módulo D, 2026-08-29): cuando
      # data-service falla (fault injection o infraestructura), service-a lo
      # atrapa en _fetch_customer() y responde 200 igual (degradación
      # controlada, no un error del cliente) -- así que http_requests_total
      # NUNCA ve un 5xx para este caso, y la regla de arriba (basada solo en
      # ese contador) es ciega a esta clase de fallo, sin importar qué tan
      # bien calibrado esté el umbral. Se usa en cambio
      # data_service_calls_total, que service-a ya emite con el outcome real
      # de cada llamada (success/http_error/unreachable) independientemente
      # del status code que termine viendo el cliente.
      # Mismo clamp_min que en http_error_rate:ratio_rate2m de arriba y
      # por la misma razón -- ver ese comentario para el detalle
      # completo del hallazgo (0/0 -> NaN -> baseline envenenado 30m ->
      # alerta ciega pese a error rate real de 100%).
      - record: service_a:data_service_error_rate:ratio_rate2m
        expr: |
          sum(rate(data_service_calls_total{job="service-a", outcome!="success"}[2m]))
          /
          clamp_min(sum(rate(data_service_calls_total{job="service-a"}[2m])), 1e-9)
          * 100

      - record: service_a:data_service_error_rate:baseline_mean_30m
        expr: avg_over_time(service_a:data_service_error_rate:ratio_rate2m[30m])

      - record: service_a:data_service_error_rate:baseline_stddev_30m
        expr: stddev_over_time(service_a:data_service_error_rate:ratio_rate2m[30m])

  - name: aiops-correlation
    rules:
      # --- Correlación (Módulo B): AMBAS señales a la vez ----------------
      # `and` entre dos vectores instantáneos sin labels adicionales (todo
      # se reduce con sum()/sin by()) -- ambos lados quedan como vectores de
      # un solo elemento sin labels, así que el match del `and` es trivial.
      # El lado de error rate ahora es un `or` entre dos fuentes: el 5xx
      # visto directamente por service-a, Y el error rate de data-service
      # (que sí detecta la degradación silenciosa -- ver el comentario en
      # la recording rule de arriba).
      - alert: CorrelatedDegradation
        expr: |
          (
            (
              service_a:http_error_rate:ratio_rate2m
              >
              (service_a:http_error_rate:baseline_mean_30m + 2 * service_a:http_error_rate:baseline_stddev_30m)
            )
            or
            (
              service_a:data_service_error_rate:ratio_rate2m
              >
              (service_a:data_service_error_rate:baseline_mean_30m + 2 * service_a:data_service_error_rate:baseline_stddev_30m)
            )
          )
          and
          (
            service_a:http_latency_p99:2m > 0.3
          )
        for: 1m
        labels:
          severity: critical
          module: aiops-correlation
        annotations:
          summary: "error_rate fuera de baseline ± 2σ Y latency_p99 > SLO (300ms) al mismo tiempo"
          description: >-
            Ver trace_id de las peticiones fallidas en Grafana Explore
            (Loki) con: {service_name="service-a"} | json | level="ERROR"
            -- cada línea trae su trace_id para saltar directo a Jaeger.

      # --- Baseline de comparación: umbral estático ingenuo --------------
      # A propósito ruidoso -- dispara con CUALQUIER 5xx, sin correlacionar
      # con latencia ni con el comportamiento histórico. Usado solo para
      # contar falsos positivos contra CorrelatedDegradation sobre el mismo
      # tráfico real (ver docs/runbooks/02-modulo-b-aiops.md).
      - alert: NaiveStatic5xx
        expr: sum(rate(http_requests_total{job="service-a", status=~"5.."}[1m])) > 0
        for: 0s
        labels:
          severity: warning
          module: aiops-naive-baseline
        annotations:
          summary: "Al menos un 5xx en el último minuto (umbral estático, sin correlación)"
